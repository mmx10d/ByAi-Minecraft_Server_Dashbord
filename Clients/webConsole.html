<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <title>لوحة تحكم خادم ماين كرافت</title>
  <style>
    body {
      font-family: sans-serif;
      background: #1e1e1e;
      color: #fff;
      padding: 20px;
    }

    .controls {
      margin-bottom: 20px;
    }

    button {
      padding: 10px 20px;
      font-weight: bold;
      cursor: pointer;
      margin-left: 10px;
      background: #333;
      color: white;
      border: 1px solid #555;
      border-radius: 4px;
    }

    button.start {
      background: #28a745;
    }

    button.stop {
      background: #dc3545;
    }

    #console {
      background: #000;
      padding: 15px;
      height: 400px;
      overflow-y: scroll;
      font-family: monospace;
      border-radius: 5px;
      border: 1px solid #444;
    }

    .input-group {
      margin-top: 15px;
      display: flex;
    }

    input {
      flex: 1;
      padding: 10px;
      background: #2a2a2a;
      border: 1px solid #555;
      color: white;
    }
  </style>
</head>

<body>

  <h2>🎮 لوحة إدارة السيرفر المرنة</h2>

  <div class="controls">
    <button class="start" onclick="sendAction('START_SERVER')">تشغيل الخادم</button>
    <button class="stop" onclick="sendAction('STOP_SERVER')">إيقاف آمن</button>
    <button onclick="sendAction('RESTART_SERVER')">إعادة تشغيل</button>
    <button onclick="sendAction('GET_HOST_STATS')">تحديث الموارد 📊</button>
  </div>

  <div id="console">--- جاري الاتصال بالخادم المركزي عبر السوكيت... ---</div>

  <div class="input-group">
    <input type="text" id="cmdInput" placeholder="اكتب أمر ماين كرافت هنا (مثال: op Ahmed) ثم اضغط Enter">
    <button onclick="sendCommand()">إرسال</button>
  </div>

  <script>
    // الاتصال الفوري بالسوكيت
    const ws = new WebSocket('ws://localhost:8080');
    const consoleDiv = document.getElementById('console');

    ws.onmessage = (event) => {
      const packet = JSON.parse(event.data);

      if (packet.type === 'LOG') {
        consoleDiv.innerHTML += `<div>${packet.data}</div>`;
        consoleDiv.scrollTop = consoleDiv.scrollHeight; // النزول التلقائي للأسفل
      } else if (packet.type === 'HOST_STATS') {
        alert(`الحالة: ${packet.data.status}\nالرام المستهلك: ${packet.data.ram}\nالمعالج: ${packet.data.cpu}`);
      }
    };

    ws.onopen = () => { consoleDiv.innerHTML = '<div>🟢 متصل بنجاح بخادم السوكيت المركزي!</div>'; };
    ws.onclose = () => { consoleDiv.innerHTML += '<div style="color:red;">🔴 انقطع الاتصال بالخادم المركزي.</div>'; };

    function sendAction(actionName) {
      ws.send(JSON.stringify({ action: actionName }));
    }

    function sendCommand() {
      const input = document.getElementById('cmdInput');
      if (!input.value) return;
      ws.send(JSON.stringify({
        action: 'MINECRAFT_COMMAND',
        payload: { command: input.value }
      }));
      input.value = '';
    }

    // دعم الإرسال عند ضغط زر Enter
    document.getElementById('cmdInput').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') sendCommand();
    });
  </script>
</body>

</html>
