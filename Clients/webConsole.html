<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ لوحة الإدارة الذكية - الخادم الرئيسي</title>
  <style>
    :root {
      --bg-primary: #0a0c10;
      --bg-secondary: #131722;
      --bg-darker: #06070a;
      --accent-green: #00e676;
      --accent-red: #ff3d00;
      --accent-blue: #00b0ff;
      --text-main: #f5f6f9;
      --text-muted: #848d9a;
      --border-color: #222938;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      padding: 30px;
    }

    /* الهيكل العام */
    .wrapper {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* الهيدر العلوي */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    header h1 {
      font-size: 24px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .server-badge {
      background: rgba(0, 230, 118, 0.1);
      color: var(--accent-green);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      border: 1px solid rgba(0, 230, 118, 0.2);
    }

    /* شبكة الكروت العلوية (الموارد والحالة) */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }

    .stat-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: var(--accent-blue);
    }

    .stat-card.ram::before {
      background: var(--accent-blue);
    }

    .stat-card.cpu::before {
      background: var(--accent-green);
    }

    .stat-card.status::before {
      background: var(--accent-green);
    }

    .stat-label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
      color: #fff;
    }

    /* صف أزرار التحكم السريع */
    .controls-row {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      font-size: 14px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      color: #fff;
    }

    .btn-start {
      background: var(--accent-green);
      color: #000;
    }

    .btn-start:hover {
      background: #00c862;
      box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
    }

    .btn-stop {
      background: var(--accent-red);
    }

    .btn-stop:hover {
      background: #e03500;
      box-shadow: 0 0 15px rgba(255, 61, 0, 0.3);
    }

    .btn-restart {
      background: #333a4d;
      border: 1px solid var(--border-color);
    }

    .btn-restart:hover {
      background: #414a61;
    }

    .btn-refresh {
      background: rgba(0, 176, 255, 0.1);
      color: var(--accent-blue);
      border: 1px solid rgba(0, 176, 255, 0.2);
      margin-right: auto;
    }

    /* قسم الكونسل والمحاكاة الاحترافية */
    .console-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .console-header {
      background: var(--bg-darker);
      padding: 15px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: var(--text-muted);
    }

    .console-screen {
      background: var(--bg-darker);
      height: 500px;
      padding: 20px;
      overflow-y: auto;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #cfd8dc;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* تلوين أسطر الكونسل لتبدو حقيقية */
    .log-line {
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      padding-bottom: 2px;
    }

    .log-error {
      color: #ff5252;
      background: rgba(255, 82, 82, 0.05);
      padding: 2px 5px;
      border-radius: 4px;
    }

    .log-system {
      color: #b0bec5;
      font-style: italic;
    }

    .log-info {
      color: #00e676;
    }

    /* شريط إدخال الأوامر السفلي */
    .console-input-wrapper {
      display: flex;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      padding: 10px;
    }

    .console-input-wrapper span {
      display: flex;
      align-items: center;
      padding: 0 15px;
      color: var(--text-muted);
      font-family: monospace;
      font-weight: bold;
    }

    .console-input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 12px;
      color: #fff;
      font-family: monospace;
      font-size: 14px;
      outline: none;
    }

    .btn-send {
      background: var(--accent-blue);
      color: #000;
      padding: 0 25px;
      border-radius: 6px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="wrapper">
    <header>
      <h1>⚡ لوحة التحكم المركزية بالخادم</h1>
      <div class="server-badge" id="badgeStatus">جاري فحص الاتصال...</div>
    </header>

    <!-- كروت الإحصائيات الفورية قراءة من الـ Host -->
    <div class="stats-grid">
      <div class="stat-card status">
        <span class="stat-label">حالة السيرفر الحية</span>
        <span class="stat-value" id="valStatus">OFFLINE</span>
      </div>
      <div class="stat-card ram">
        <span class="stat-label">استهلاك الذاكرة عشوائية (RAM)</span>
        <span class="stat-value" id="valRam">0.00%</span>
      </div>
      <div class="stat-card cpu">
        <span class="stat-label">استهلاك المعالج (CPU)</span>
        <span class="stat-value" id="valCpu">0.00%</span>
      </div>
      <div class="stat-card players">
        <span class="stat-label">اللاعبين المتصلين</span>
        <span class="stat-value" id="valPlayers">0</span>
      </div>
    </div>

    <!-- أزرار التحكم السريع المرتبطة بالسوكيت مباشرة -->
    <div class="controls-row">
      <button class="btn btn-start" onclick="sendAction('START_SERVER')">▶ تشغيل السيرفر</button>
      <button class="btn btn-stop" onclick="sendAction('STOP_SERVER')">⏹ إيقاف آمن</button>
      <button class="btn btn-restart" onclick="sendAction('RESTART_SERVER')">🔄 إعادة تشغيل</button>
      <button class="btn btn-refresh" onclick="sendAction('GET_HOST_STATS')">📊 تحديث فوري للموارد</button>
    </div>

    <!-- صندوق الكونسل الذكي المطور -->
    <div class="console-container">
      <div class="console-header">
        <span>شاشة الكونسل الحية والمخرجات الصادرة من الخادم</span>
        <span id="socketIndicator">WebSocket: منفصل</span>
      </div>
      <div class="console-screen" id="consoleScreen">
        <div class="log-line log-system">[System]: بانتظام فتح خط الاتصال بالسوكيت المركزي...</div>
      </div>
      <div class="console-input-wrapper">
        <span>&gt;</span>
        <input type="text" id="cmdInput" class="console-input"
          placeholder="اكتب أمر خادم ماين كرافت هنا فورا واضغط Enter (مثل: op, whitelist, kick)...">
        <button class="btn-send" onclick="sendCommand()">تنفيذ</button>
      </div>
    </div>
  </div>

  <!-- كود المحرك الجافا سكريبت التفاعلي سيتم حقنه في الجزء الثاني من رسالتك القادمة -->
</body>
    <script>
      // الاتصال الفوري بالسوكيت المركزي التابع للمشروع
      const ws = new WebSocket('ws://localhost:8080');
      const consoleScreen = document.getElementById('consoleScreen');
      const socketIndicator = document.getElementById('socketIndicator');
      const badgeStatus = document.getElementById('badgeStatus');

      // كروت البيانات
      const valStatus = document.getElementById('valStatus');
      const valRam = document.getElementById('valRam');
      const valCpu = document.getElementById('valCpu');
      const valPlayers = document.getElementById('valPlayers');

      // عند فتح الاتصال بنجاح
      ws.onopen = () => {
        socketIndicator.innerText = 'WebSocket: متصل 🟢';
        socketIndicator.style.color = '#00e676';
        badgeStatus.innerText = 'لوحة التحكم متصلة بالخادم';
        badgeStatus.style.borderColor = 'rgba(0, 176, 255, 0.3)';
        badgeStatus.style.color = '#00b0ff';

        // طلب إحصائيات الموارد فور الاتصال
        sendAction('GET_HOST_STATS');
      };

      // عند انقطاع الاتصال
      ws.onclose = () => {
        socketIndicator.innerText = 'WebSocket: منفصل 🔴';
        socketIndicator.style.color = '#ff3d00';
        badgeStatus.innerText = 'انقطع الاتصال بالخادم المركزي';
        badgeStatus.style.borderColor = 'rgba(255, 61, 0, 0.3)';
        badgeStatus.style.color = '#ff3d00';
      };

      // استقبال وتحليل الحزم القادمة من السيرفر (JSON)
      ws.onmessage = (event) => {
        try {
          const packet = JSON.parse(event.data);

          if (packet.type === 'LOG') {
            appendLogLine(packet.data);
          } else if (packet.type === 'HOST_STATS') {
            // تحديث الكروت العلوية حياً
            valStatus.innerText = packet.data.status;
            valRam.innerText = packet.data.ram;
            valCpu.innerText = packet.data.cpu;
            valPlayers.innerText = packet.data.playersOnline.length;

            // تلوين كرت الحالة بناءً على وضع السيرفر
            if (packet.data.status === 'ONLINE') {
              valStatus.style.color = '#00e676';
            } else {
              valStatus.style.color = '#ff3d00';
            }
          }
        } catch (e) {
          // في حال وصول نص عادي احتياطياً
          appendLogLine(event.data);
        }
      };

      // دالة لطباعة الأسطر في الكونسل وتلوينها بحسب نوع السجل
      function appendLogLine(text) {
        const line = document.createElement('div');
        line.className = 'log-line';

        if (text.includes('[ERROR]') || text.includes('WARN')) {
          line.className += ' log-error';
        } else if (text.includes('[System]') || text.includes('[Minecraft]:')) {
          line.className += ' log-system';
        } else if (text.includes('Done') || text.includes('joined the game')) {
          line.className += ' log-info';
        }

        line.innerText = text;
        consoleScreen.appendChild(line);
        consoleScreen.scrollTop = consoleScreen.scrollHeight; // نزول تلقائي لآخر السطور
      }

      // إرسال طلب أكشن عام (تشغيل/إطفاء/طلب موارد)
      function sendAction(actionName) {
        ws.send(JSON.stringify({ action: actionName }));
      }

      // إرسال أمر مباشر كونسل لماين كرافت
      function sendCommand() {
        const input = document.getElementById('cmdInput');
        if (!input.value.trim()) return;

        ws.send(JSON.stringify({
          action: 'MINECRAFT_COMMAND',
          payload: { command: input.value.trim() }
        }));

        input.value = '';
      }

      // تفعيل الإرسال الفوري عند ضغط زر Enter في الكيبورد
      document.getElementById('cmdInput').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') sendCommand();
      });

      // تحديث الرام والمعالج تلقائياً كل 5 ثوانٍ لتبقى البيانات حية
      setInterval(() => {
        if (ws.readyState === WebSocket.OPEN) {
          sendAction('GET_HOST_STATS');
        }
      }, 5000);
    </script>

</html>
